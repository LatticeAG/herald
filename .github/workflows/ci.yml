name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Differential fuzz (CI-sized)
        run: FUZZ_CASES=20000 STRICT_EVERY=50 npm run fuzz:differential
      - name: Schedule fuzz (CI-sized)
        run: FUZZ_CASES=500 npm run fuzz:schedule
      - name: Schema artifacts are fresh
        run: |
          node scripts/gen-schemas.ts /tmp/schemas-check
          diff -r /tmp/schemas-check schemas

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography pytest
      - run: cd python && PYTHONPATH=src pytest -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: CLI happy path
        run: bash tests/smoke/smoke.sh
