[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latticeag-herald"
version = "1.0.0"
description = "Herald sovereign agent identity registry — Python library: canonical JSON, tagged digests, strict Ed25519, offline verifier, HTTP client"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=41.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
